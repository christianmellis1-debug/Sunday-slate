name: NFL historical line movement research

on:
  push:
    branches:
      - research/historical-line-movement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/historical-line-movement
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe ESPN odds source routing
        run: python backtests/espn_line_probe.py
      - name: Save research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/output
          if ! git diff --cached --quiet; then
            git commit -m "Save historical line research diagnostics"
            git push origin HEAD:research/historical-line-movement
          fi
