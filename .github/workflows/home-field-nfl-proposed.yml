name: Research NFL home field advantage proposal

on:
  push:
    paths:
      - ".github/workflows/home-field-nfl-proposed.yml"
      - "research/home_field_nfl_proposed.py"
      - "research/validate_home_field_tier.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install statistical packages
        run: python -m pip install -r requirements.txt
      - name: Validate magnitude tier against Elo and reference odds
        run: python -m research.validate_home_field_tier
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nfl-home-field-proposed-validation
          path: nfl_home_field_tier_validation.json
          retention-days: 30
