name: Sunday Slate Phase 4 EPA and QB model backtest

on:
  push:
    paths:
      - "research/model_epa_qbr_study.py"
      - ".github/workflows/model-epa-qbr-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "scikit-learn>=1.5,<2.0"
      - name: Run historical, pregame-only Elo/EPA/QBR comparisons
        run: |
          python -m research.model_epa_qbr_study --output epa_qbr_model_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-epa-qbr-model-results
          path: epa_qbr_model_results.json
          retention-days: 30
