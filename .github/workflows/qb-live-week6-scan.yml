name: Sunday Slate 2026 Week 6 QB scan

on:
  push:
    paths:
      - research/qb_live_week6_scan.py
      - .github/workflows/qb-live-week6-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-qb-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan current week-6 QB confirmations and Elo
        run: python -m research.qb_live_week6_scan
      - name: Retain research-only game results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-qb-availability-scan
          path: qb_live_2026_week6.json
          retention-days: 14
          if-no-files-found: warn
