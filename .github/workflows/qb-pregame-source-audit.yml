name: Sunday Slate QB pregame source audit

on:
  push:
    paths:
      - "research/qb_pregame_source_probe.py"
      - ".github/workflows/qb-pregame-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Inspect pregame historical QB availability sources
        run: python -m research.qb_pregame_source_probe
