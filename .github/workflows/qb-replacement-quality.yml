name: Sunday Slate QB replacement-quality investigation

on:
  push:
    paths:
      - "research/qb_replacement_quality_study.py"
      - ".github/workflows/qb-replacement-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qb-replacement-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "scikit-learn>=1.5,<2.0"
      - name: Execute independent prior-week QB research
        run: python -m research.qb_replacement_quality_study --output qb_replacement_quality_results.json
      - name: Save full research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-replacement-quality-backtest
          path: qb_replacement_quality_results.json
          if-no-files-found: warn
          retention-days: 30
