name: Sunday Slate QBR-defense magnitude research

on:
  push:
    paths:
      - ".github/workflows/qbr-defense-magnitude.yml"
      - "research/qbr_defense_magnitude.py"
      - "research/test_qbr_defense.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-magnitude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install pandas==2.3.3
      - name: Test gap sizes against Elo and untouched seasons
        run: |
          python -m research.qbr_defense_magnitude --output magnitude_results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qbr-defense-magnitude-results
          path: magnitude_results.json
          retention-days: 30
