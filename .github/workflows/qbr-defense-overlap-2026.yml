name: Sunday Slate 2026 QBR and defense overlap
on:
  push:
    paths:
      - '.github/workflows/qbr-defense-overlap-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qbr-defense-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.3.3
      - name: Grade 2026 pregame higher-QBR and stronger scoring defense
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          import pandas as pd
          from research.test_qbr_defense import load_games, load_qbr, normalized
          games=load_games()
          allq=load_qbr()
          qb=allq[allq.season.isin([2025,2026])].copy()
          curr=qb[qb.season.eq(2026)]
          leads={}
          for (w,t),rs in curr.groupby(['week_num','team_abb']):
              r=rs.sort_values('qb_plays',ascending=False).iloc[0]
              leads[(int(w),str(t))]=str(r.player_id)
          def qbr_before(pid,w):
              year=2025 if w==1 else 2026
              z=qb[(qb.season==year)&qb.player_id.astype(str).eq(str(pid))]
              if w>1:z=z[z.week_num.lt(w)]
              n=z.qb_plays.sum()
              return None if n<30 else float((z.qbr_total*z.qb_plays).sum()/n)
          def def_state():
              return defaultdict(lambda:[0.0,0])
          prev=def_state()
          for g in games[games.season.eq(2025)&games.home_score.notna()&games.away_score.notna()].itertuples(index=False):
              h,a=normalized(g.home_team),normalized(g.away_team)
              prev[h][0]+=float(g.away_score);prev[h][1]+=1
              prev[a][0]+=float(g.home_score);prev[a][1]+=1
          last_year={t:p[0]/p[1] for t,p in prev.items() if p[1]}
          current=def_state()
          slate=games[games.season.eq(2026)&games.week.le(6)&games.home_score.notna()&games.away_score.notna()].sort_values(['week','game_id'])
          rows=[]
          for w,gs in slate.groupby('week',sort=True):
              w=int(w)
              for g in gs.itertuples(index=False):
                  h,a=normalized(g.home_team),normalized(g.away_team)
                  hpid,apid=leads.get((w,h)),leads.get((w,a))
                  hq=qbr_before(hpid,w) if hpid else None
                  aq=qbr_before(apid,w) if apid else None
                  winner='TIE' if g.home_score==g.away_score else h if g.home_score>g.away_score else a
                  qp=None if hq is None or aq is None or hq==aq else h if hq>aq else a
                  if w==1:
                      hd,ad=last_year.get(h),last_year.get(a)
                  else:
                      hd=current[h][0]/current[h][1] if current[h][1] else None
                      ad=current[a][0]/current[a][1] if current[a][1] else None
                  dp=None if hd is None or ad is None or abs(hd-ad)<1e-10 else h if hd<ad else a
                  rows.append(dict(week=w,game_id=str(g.game_id),home=h,away=a,winning_team=winner,
                      home_score=int(g.home_score),away_score=int(g.away_score),
                      home_qbr=round(hq,4) if hq is not None else None,
                      away_qbr=round(aq,4) if aq is not None else None,
                      home_def_ppg=round(hd,4) if hd is not None else None,
                      away_def_ppg=round(ad,4) if ad is not None else None,
                      qbr_pick=qp,defense_pick=dp,
                      qbr_correct=qp==winner if qp and winner!='TIE' else None,
                      defense_correct=dp==winner if dp and winner!='TIE' else None,
                      agree=bool(qp and dp and qp==dp),
                      qbr_gap=round(abs(hq-aq),4) if hq is not None and aq is not None else None,
                      reason='tie' if winner=='TIE' else 'missing_qbr' if qp is None else 'eligible'))
              for g in gs.itertuples(index=False):
                  h,a=normalized(g.home_team),normalized(g.away_team)
                  current[h][0]+=float(g.away_score);current[h][1]+=1
                  current[a][0]+=float(g.home_score);current[a][1]+=1
          eligible=[r for r in rows if r['reason']=='eligible']
          agree=[r for r in eligible if r['agree']]
          disagree=[r for r in eligible if r['defense_pick'] and not r['agree']]
          def measure(z,pick):
              n=len(z);wins=sum(r[pick] is True for r in z)
              return dict(n=n,wins=wins,losses=n-wins,rate=round(wins*100/n,2) if n else None)
          weekly=[]
          for w in range(1,7):
              s=[r for r in eligible if r['week']==w]
              both=[r for r in s if r['agree']]
              other=[r for r in s if r['defense_pick'] and not r['agree']]
              weekly.append(dict(week=w,qbr_eligible=len(s),both_agree=measure(both,'qbr_correct'),
                  factors_disagree=measure(other,'qbr_correct'),missing_defense=sum(not r['defense_pick'] for r in s)))
          gaps=[]
          for lo,hi in [(0,5),(5,10),(10,20),(20,None)]:
              group=[r for r in eligible if r['qbr_gap']>=lo and (hi is None or r['qbr_gap']<hi)]
              overlap=[r for r in group if r['agree']]
              gaps.append(dict(qbr_gap=f'{lo} to {hi or "plus"}',
                 qbr_sample=measure(group,'qbr_correct'),both_agree=measure(overlap,'qbr_correct')))
          summary=dict(method='ESPN weekly play-weighted prior QBR, retrospective game-leading QB; stronger defense is lower pregame points-allowed per game; Week 1 defensive baseline 2025 season, Week 2 onward previous 2026 games; ties omitted',
              completed_games=len(rows),qbr_eligible=measure(eligible,'qbr_correct'),
              both_qbr_and_defense_agree=measure(agree,'qbr_correct'),
              qbr_pick_defense_disagrees=measure(disagree,'qbr_correct'),
              defense_pick_when_disagrees=measure(disagree,'defense_correct'),
              missing_defense=len([r for r in eligible if not r['defense_pick']]),
              defense_pick_same_qbr_games=measure([r for r in eligible if r['defense_pick']],'defense_correct'),
              weekly=weekly,qbr_gap_buckets=gaps)
          Path('qbr_defense_overlap_2026.json').write_text(json.dumps(dict(summary=summary,games=rows),indent=2))
          pd.DataFrame(rows).to_csv('qbr_defense_overlap_2026.csv',index=False)
          print('AUDIT_SUMMARY_BEGIN')
          print(json.dumps(summary,indent=2))
          print('AUDIT_SUMMARY_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbr-defense-overlap-2026
          path: |
            qbr_defense_overlap_2026.json
            qbr_defense_overlap_2026.csv
          retention-days: 30
