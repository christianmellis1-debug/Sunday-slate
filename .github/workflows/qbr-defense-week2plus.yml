name: Sunday Slate QBR defensive metrics Weeks 2-6 comparison
on:
  push:
    paths:
      - '.github/workflows/qbr-defense-week2plus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m research.qbr_defensive_epa_2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbr-defense-weeks2-6-comparison
          path: |
            qbr_defensive_epa_2026.json
            qbr_defensive_epa_2026.csv
          retention-days: 30
