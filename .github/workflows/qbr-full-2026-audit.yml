name: Sunday Slate complete 2026 QBR audit
on:
  push:
    paths:
      - '.github/workflows/qbr-full-2026-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qbr-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.3.3
      - name: All completed weeks QBR versus winners
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          from research.test_qbr_defense import load_games, load_qbr, normalized
          from sunday_slate.model import predict_regular_season
          games=load_games()
          qb=load_qbr()
          qb=qb[qb.season.isin([2025,2026])].copy()
          curr=qb[qb.season.eq(2026)]
          leads={}
          for (week,team),rs in curr.groupby(['week_num','team_abb']):
              r=rs.sort_values('qb_plays',ascending=False).iloc[0]
              leads[(int(week),str(team))]=(str(r.player_id),str(r.get('name','')))
          def before(pid,week):
              year=2025 if week==1 else 2026
              z=qb[(qb.season==year)&qb.player_id.astype(str).eq(str(pid))]
              if week>1:z=z[z.week_num.lt(week)]
              n=z.qb_plays.sum()
              return None if n<30 else float((z.qbr_total*z.qb_plays).sum()/n)
          g=games[games.season.eq(2026)&games.week.le(6)&games.home_score.notna()&games.away_score.notna()]
          g=g.sort_values(['week','game_id'])
          rows=[]
          for r in g.itertuples(index=False):
              w=int(r.week);h=normalized(r.home_team);a=normalized(r.away_team)
              hp=leads.get((w,h));ap=leads.get((w,a))
              hq=before(hp[0],w) if hp else None
              aq=before(ap[0],w) if ap else None
              win='TIE' if r.home_score==r.away_score else h if r.home_score>r.away_score else a
              pick=None if hq is None or aq is None or hq==aq else h if hq>aq else a
              reason=('tie' if win=='TIE' else 'no_home_week_qbr' if not hp else
                  'no_away_week_qbr' if not ap else 'no_home_prior_qbr' if hq is None else
                  'no_away_prior_qbr' if aq is None else 'equal_prior_qbr' if pick is None else 'eligible')
              rows.append(dict(week=w,id=str(r.game_id),home=h,away=a,home_score=int(r.home_score),away_score=int(r.away_score),
                  winning_team=win,home_qb=hp[1] if hp else None,away_qb=ap[1] if ap else None,
                  home_qb_id=hp[0] if hp else None,away_qb_id=ap[0] if ap else None,
                  home_prior_qbr=round(hq,2) if hq is not None else None,away_prior_qbr=round(aq,2) if aq is not None else None,
                  qbr_gap=round(abs(hq-aq),2) if hq is not None and aq is not None else None,
                  pick=pick,correct=pick==win if pick and win!='TIE' else None,reason=reason))
          def stats(z):
              n=len(z);win=sum(r['correct'] is True for r in z)
              return dict(n=n,wins=win,losses=n-win,pct=round(100*win/n,2) if n else None)
          eligible=[r for r in rows if r['reason']=='eligible']
          weeks=[]
          for week in range(1,7):
              a=[r for r in rows if r['week']==week]
              b=[r for r in a if r['reason']=='eligible']
              weeks.append(dict(week=week,games_completed=len(a),**stats(b),
                  exclusions=[f"{r['away']}@{r['home']}:{r['reason']}" for r in a if r['reason']!='eligible']))
          gaps=[]
          for lo,hi in [(0,5),(5,10),(10,20),(20,None)]:
              s=[r for r in eligible if r['qbr_gap']>=lo and (hi is None or r['qbr_gap']<hi)]
              gaps.append(dict(range=f'{lo} to {hi or "plus"}',**stats(s)))
          top10=[]
          for week in range(2,7):
              old=qb[(qb.season==2026)&qb.week_num.lt(week)]
              ranking=[]
              for pid,z in old.groupby('player_id'):
                  plays=z.qb_plays.sum()
                  if plays>=30:ranking.append((str(pid),float((z.qbr_total*z.qb_plays).sum()/plays)))
              ids={pid for pid,score in sorted(ranking,key=lambda p:-p[1])[:10]}
              top10.extend(r for r in eligible if r['week']==week and (r['home_qb_id'] in ids or r['away_qb_id'] in ids))
          elo=predict_regular_season(games)
          picks=dict(zip(elo.game_id.astype(str),elo.predicted_winner.astype(str)))
          shared=[r for r in eligible if r['id'] in picks]
          ew=sum(picks[r['id']]==r['winning_team'] for r in shared)
          summary=dict(source='nflverse ESPN QBR weekly; nfldata games',
              method='Retrospective lead QB by current-game QB plays; QB plays-weighted QBR across ONLY prior 2026 weeks (2025 season for Week 1), min 30 prior QB plays; NOT official season composite or confirmed starter',
              max_qbr_week_2026=int(curr.week_num.max()) if len(curr) else None,
              games_completed=len(rows),all=stats(eligible),weeks=weeks,gaps=gaps,top10_weeks2to6=stats(top10),
              elo_same_games=dict(n=len(shared),wins=ew,losses=len(shared)-ew))
          Path('qbr_full_2026.json').write_text(json.dumps(dict(summary=summary,games=rows),indent=2))
          pd.DataFrame(rows).to_csv('qbr_full_2026.csv',index=False)
          print('RESULT_BEGIN')
          print(json.dumps(summary,indent=2))
          print('RESULT_END')
          print('GAMES_BEGIN')
          for row in rows:print(json.dumps(row))
          print('GAMES_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbr-full-2026-audit
          path: |
            qbr_full_2026.json
            qbr_full_2026.csv
          retention-days: 30
