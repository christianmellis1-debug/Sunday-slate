name: Sunday Slate triple agreement favorite vs underdog
on:
  push:
    paths:
      - '.github/workflows/qbr-ppg-favorite-split.yml'
      - 'research/qbr_ppg_favorite_split.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  favorite-split:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m research.qbr_ppg_favorite_split
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbr-ppg-favorite-split
          path: |
            qbr_ppg_favorite_split_2023_2025.json
            qbr_ppg_favorite_split_2023_2025.csv
          retention-days: 30
