name: Sunday Slate QBR plus scoring-defense historical validation
on:
  push:
    paths:
      - '.github/workflows/qbr-ppg-historical-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-qbr-ppg:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical research dependencies
        run: python -m pip install -r requirements.txt
      - name: Test 2023-2026 QBR and scoring-defense combinations
        run: python -m research.qbr_ppg_historical_validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbr-ppg-historical-validation
          path: |
            qbr_ppg_historical_validation.json
            qbr_ppg_historical_validation.csv
          retention-days: 30
