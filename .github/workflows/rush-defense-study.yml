name: Sunday Slate rush defense hypothesis backtest

on:
  push:
    paths:
      - ".github/workflows/rush-defense-study.yml"
      - "research/run_defense_rush.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rush-defense:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nflverse analysis stack
        run: |
          python -m pip install -r requirements.txt
      - name: Run historical discovery holdout and ATS comparisons
        run: |
          python -m research.run_defense_rush --output run_defense_rush_results.json
      - name: Upload full reproducible research
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: run-defense-rush-backtest
          path: run_defense_rush_results.json
          retention-days: 60
