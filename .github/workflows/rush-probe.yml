name: Sunday Slate PBP rushing data probe

on:
  push:
    paths:
      - "research/probe_rush_data.py"
      - ".github/workflows/rush-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-data:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m research.probe_rush_data
