name: Sunday Slate near-miss shortlist research

on:
  push:
    branches:
      - research/shortlist-near-misses
    paths:
      - "research/shortlist_nearmisses.py"
      - "tests/test_shortlist_nearmisses.py"
      - ".github/workflows/shortlist-nearmisses.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunday-nearmiss-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/shortlist-near-misses
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing study dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify research logic
        run: python -m pytest -q tests/test_shortlist_nearmisses.py
      - name: Run near-miss backtest
        run: python -m research.shortlist_nearmisses
      - name: Preserve research-only results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/output/shortlist_nearmisses.json research/output/shortlist_nearmisses.md
          if ! git diff --cached --quiet; then
            git commit -m "Record historical near-miss shortlist backtest"
            git push origin HEAD:research/shortlist-near-misses
          fi
